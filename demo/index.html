<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeMirror 6 — Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1b1e;
      --surface: #212226;
      --surface2: #2a2c31;
      --border: #3a3c42;
      --accent: #528bff;
      --accent2: #c678dd;
      --text: #abb2bf;
      --text-dim: #5c6370;
      --green: #98c379;
      --yellow: #e5c07b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.2px;
    }

    .badge {
      font-size: 11px;
      background: var(--accent);
      color: #fff;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 500;
    }

    .toolbar {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .toolbar label { font-size: 12px; color: var(--text-dim); }

    .lang-btn {
      padding: 4px 14px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .lang-btn:hover { border-color: var(--accent); color: var(--accent); }
    .lang-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .separator { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }

    #getValue-btn {
      margin-left: auto;
      padding: 4px 12px;
      border-radius: 5px;
      border: 1px solid var(--green);
      background: transparent;
      color: var(--green);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    #getValue-btn:hover { background: var(--green); color: #1a1b1e; }

    #editor-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #editor {
      height: 100%;
      overflow: auto;
    }

    /* CodeMirror overrides */
    #editor .cm-editor {
      height: 100%;
      background: var(--bg);
    }
    #editor .cm-scroller { overflow: auto; }

    #output {
      position: fixed;
      bottom: 0; right: 0;
      width: 340px;
      max-height: 220px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px 0 0 0;
      overflow: auto;
      padding: 12px 14px;
      font-family: monospace;
      font-size: 12px;
      color: var(--green);
      display: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<header>
  <h1>CodeMirror 6 Bundle</h1>
  <span class="badge">Demo</span>
</header>

<div class="toolbar">
  <label>Ngôn ngữ:</label>
  <button class="lang-btn active" data-lang="javascript">JavaScript</button>
  <button class="lang-btn" data-lang="css">CSS</button>
  <button class="lang-btn" data-lang="html">HTML</button>
  <div class="separator"></div>
  <button id="getValue-btn">Lấy nội dung</button>
</div>

<div id="editor-wrap">
  <div id="editor"></div>
</div>

<pre id="output"></pre>

<!-- 1. Load core trước -->
<script src="../dist/codemirror-core.js"></script>
<!-- 2. Load các language pack (có thể load có điều kiện / lazy) -->
<script src="../dist/lang-javascript.js"></script>
<script src="../dist/lang-css.js"></script>
<script src="../dist/lang-html.js"></script>

<script>
  const SAMPLES = {
    javascript: `// JavaScript sample
function greet(name) {
  const msg = \`Hello, \${name}!\`;
  console.log(msg);
  return msg;
}

greet('World');
`,
    css: `/* CSS sample */
:root {
  --primary: #528bff;
  --bg: #1a1b1e;
}

.container {
  display: flex;
  align-items: center;
  background: var(--bg);
  color: var(--primary);
  border-radius: 8px;
  padding: 1rem 1.5rem;
}
`,
    html: `<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Demo</title>
</head>
<body>
  <h1>Hello World</h1>
  <p>Đây là đoạn văn bản mẫu.</p>
  <script>
    console.log('embedded JS');
  <\/script>
</body>
</html>
`,
  };

  // Khởi tạo editor
  let currentLang = 'javascript';
  const editor = CodeMirrorEditor.create(document.getElementById('editor'), {
    language: currentLang,
    doc: SAMPLES[currentLang],
    onChange(update) {
      // Ví dụ onChange callback
    },
  });

  // Xử lý nút đổi ngôn ngữ
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const lang = btn.dataset.lang;
      if (lang === currentLang) return;

      document.querySelector('.lang-btn.active').classList.remove('active');
      btn.classList.add('active');

      currentLang = lang;
      editor.setValue(SAMPLES[lang]);
      editor.setLanguage(lang);
    });
  });

  // Nút lấy nội dung
  document.getElementById('getValue-btn').addEventListener('click', () => {
    const out = document.getElementById('output');
    out.style.display = 'block';
    out.textContent = editor.getValue();
    setTimeout(() => { out.style.display = 'none'; }, 5000);
  });
</script>
</body>
</html>
